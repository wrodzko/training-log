name: Garmin sync

on:
  schedule:
    - cron: "30 4 * * *" # daily, ~06:30 in Poland
  workflow_dispatch:
    inputs:
      days:
        description: "How many recent days to fetch (90 for the first backfill)"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - name: Sync Garmin → Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          DAYS: ${{ github.event.inputs.days || '3' }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "days must be a number"; exit 1;; esac
          python sync/garmin_sync.py --days "$DAYS"
